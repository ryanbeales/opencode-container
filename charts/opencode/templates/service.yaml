apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode.fullname" . }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "ui" "combined" .Values.splitDeployment }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opencode.selectorLabelsComponent" (dict "context" . "component" (ternary "ui" "combined" .Values.splitDeployment)) | nindent 4 }}

{{ if .Values.splitDeployment }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode.fullname" . }}-server
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 41851
      targetPort: 41851
      protocol: TCP
      name: http-server
  selector:
    {{- include "opencode.selectorLabelsComponent" (dict "context" . "component" "server") | nindent 4 }}
{{- end }}
